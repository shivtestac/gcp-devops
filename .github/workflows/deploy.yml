name: Build and Push to Artifact Registry

on:
  push:
    branches:
      - main

jobs:
  test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate using your verified Workload Identity Pool
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1054617119823/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@bora999.iam.gserviceaccount.com'

      # Configure Docker to talk to your registry region
      - name: Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      # Build a dummy image and push it
      - name: Build and Push Sample
        run: |
          docker build -t us-central1-docker.pkg.dev/bora999/prod-gcr/sample-test:v1 .
          docker push us-central1-docker.pkg.dev/bora999/prod-gcr/sample-test:v1

      - name: Final Status
        if: success()
        run: echo "🚀 Sample image pushed successfully to prod-gcr!"
