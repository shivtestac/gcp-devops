steps:
# ------------------------
# Print branch info
# ------------------------
- name: gcr.io/cloud-builders/gcloud
  entrypoint: bash
  args:
    - -c
    - |
      echo "Branch: $BRANCH_NAME"
      if [[ "$BRANCH_NAME" == "main" ]]; then
        echo "Deploying to PROD"
      elif [[ "$BRANCH_NAME" == "dev" ]]; then
        echo "Deploying to DEV"
      else
        echo "Unsupported branch"
        exit 1
      fi

# ------------------------
# Build image
# ------------------------
- name: gcr.io/cloud-builders/docker
  args:
    - build
    - -t
    - us-central1-docker.pkg.dev/swift-arcadia-484906-v2/gke-repo/myapp:$SHORT_SHA
    - ./app

# ------------------------
# Push image
# ------------------------
- name: gcr.io/cloud-builders/docker
  args:
    - push
    - us-central1-docker.pkg.dev/swift-arcadia-484906-v2/gke-repo/myapp:$SHORT_SHA

# ------------------------
# Deploy based on branch
# ------------------------
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
    - -c
    - |
      # Internal shell variable (no dollar sign during assignment)
      if [[ "$BRANCH_NAME" == "main" ]]; then
        DEPLOY_TARGET="prod"
      elif [[ "$BRANCH_NAME" == "dev" ]]; then
        DEPLOY_TARGET="dev"
      else
        echo "No deployment for this branch"
        exit 0
      fi

      gcloud deploy releases create release-$SHORT_SHA \
        --delivery-pipeline=myapp-pipeline \
        --region=us-central1 \
        --to-target=$$DEPLOY_TARGET \
        --images=myapp=us-central1-docker.pkg.dev/swift-arcadia-484906-v2/gke-repo/myapp:$SHORT_SHA \
        --source=.

# FIXED: Moved to the far left margin
options:
  logging: CLOUD_LOGGING_ONLY
