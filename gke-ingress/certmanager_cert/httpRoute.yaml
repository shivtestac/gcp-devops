apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fakr-route
spec:
  parentRefs:
  - name: external-http
  hostnames:
  - fakr.co.in

  rules:
  - backendRefs:
    - name: apache-service
      port: 80
---
